<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1422"><title>BiliPDJ Go · 直播弹幕控制台</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="app" v-cloak>
<aside class="sidebar"><div class="brand"><div class="logo">B</div><div><strong>BiliPDJ <em>GO</em></strong><small>LIVE OPERATIONS</small></div></div>
<div class="side-label">工作空间</div><button :class="['nav', {selected:page==='dashboard'}]" @click="page='dashboard'"><span>◫</span> 直播总览</button><button :class="['nav', {selected:page==='settings'}]" @click="page='settings'"><span>⚙</span> 平台配置</button><button :class="['nav', {selected:page==='update'}]" @click="page='update'"><span>↻</span> 软件更新</button><div class="sidebar-bottom"><span class="dot" :class="streamReady?'online':'offline'"></span> {{streamReady?'实时事件流已连接':'事件流连接中'}}<p>v{{status.version || '0.1.0'}} · Go + Vue 3</p></div></aside>
<div class="content"><header class="topbar"><div class="crumb">BiliPDJ <b>/</b> {{page==='dashboard'?'直播总览':page==='settings'?'平台配置':'软件更新'}}</div><div class="topright"><span class="time">{{now}}</span><a href="/overlay.html" target="_blank" rel="noopener" class="btn small">打开 OBS 展示 ↗</a></div></header>
<main>
<div v-if="notice" class="notice" :class="noticeLevel">{{notice}} <button @click="notice=''">×</button></div>
<template v-if="page==='dashboard'"><div class="page-title"><div><p class="eyebrow">LIVE DASHBOARD</p><h1>直播运行总览</h1><p class="muted">同时管理双平台弹幕，统一处理排队消息。</p></div><button class="btn" @click="refresh">↻ 刷新状态</button></div>
<div class="stat-grid"><article class="stat"><span class="meta">已连接的平台</span><b>{{connectedCount}} <small>/ 2</small></b><div class="stat-foot">B站 + 抖音</div></article><article class="stat"><span class="meta">当前排队人数</span><b>{{queue.length}}</b><div class="stat-foot">同平台同用户去重</div></article><article class="stat"><span class="meta">最近弹幕</span><b>{{messages.length}}</b><div class="stat-foot">只保留最近 150 条</div></article></div>
<div class="platform-grid"><article v-for="p in platforms" :key="p.id" class="panel platform"><div class="platform-head"><div><span class="platform-icon" :class="p.id">{{p.id==='bilibili'?'B':'抖'}}</span><strong>{{p.name}}</strong></div><span class="pill" :class="statuses[p.id]?.connected?'active':'inactive'">{{statuses[p.id]?.connected?'● 已连接':'○ 未连接'}}</span></div><p class="platform-room">{{config[p.id]?.room || '尚未配置直播间'}}</p><p class="platform-help">{{statuses[p.id]?.message || '等待配置'}}</p><button class="link-btn" @click="page='settings'">配置直播间 →</button></article></div>
<div class="slot-toolbar panel"><strong>排队存档</strong><select v-model.number="selectedSlot" @change="changeSlot"><option v-for="n in 10" :key="n" :value="n">槽位 {{n}}（{{slotInfo.slots[n]||0}} 人）</option></select><span class="tip">10 个槽位独立保存，切换不会删除其他槽位数据</span></div><div class="columns"><section class="panel"><div class="panel-title"><div><h2>实时弹幕</h2><small>两平台实时消息汇总</small></div><span class="counter">{{messages.length}} 条</span></div><div class="filter"><button v-for="f in filters" :key="f.id" :class="['chip',{on:filter===f.id}]" @click="filter=f.id">{{f.name}}</button></div><div class="messages"><div v-for="(m,i) in filteredMessages" :key="i" class="message"><span class="source" :class="m.platform">{{m.platform==='bilibili'?'B站':'抖音'}}</span><div><div class="message-head"><strong>{{m.username}}</strong><time>{{dateTime(m.time)}}</time></div><p>{{m.content}}</p></div></div><div v-if="filteredMessages.length===0" class="empty">尚未收到弹幕。配置直播间并启动平台监听。</div></div></section>
<section class="panel"><div class="panel-title"><div><h2>排队列表</h2><small>弹幕发送「{{config.command || '排队'}}」自动加入</small></div><button class="danger-link" @click="clearQueue" :disabled="queue.length===0">清空</button></div><div class="manual"><input v-model.trim="newName" placeholder="手动添加用户名" maxlength="60" @keyup.enter="addQueue"><button class="btn primary" @click="addQueue">添加</button></div><div class="queue"><div v-for="(q,i) in queue" :key="q.key" class="queue-item"><span class="rank">{{i+1}}</span><div><strong><span v-if="q.mode">[{{q.mode}}] </span>{{q.username}}</strong><p>{{q.platform==='bilibili'?'B站':q.platform==='douyin'?'抖音':'手动'}} <span v-if="q.note">· {{q.note}}</span></p></div><button title="上移" :disabled="i===0" @click="moveQueue(q,i-1)">↑</button><button title="下移" :disabled="i===queue.length-1" @click="moveQueue(q,i+1)">↓</button><button title="编辑备注" @click="editQueue(q)">✎</button><button title="移除" @click="removeQueue(q.key)">×</button></div><div v-if="queue.length===0" class="empty">队列还是空的</div></div></section></div></template>
<template v-else-if="page==='settings'"><div class="page-title"><div><p class="eyebrow">PLATFORM CONFIGURATION</p><h1>平台与弹幕规则</h1><p class="muted">保存后自动重新连接；两个直播平台可以同时开启。</p></div></div><div class="settings-grid"><article class="panel settings-card" v-for="p in platforms" :key="p.id"><div class="setting-head"><h2>{{p.name}} 直播间</h2><label class="switch"><input type="checkbox" v-model="config[p.id].enabled"><span class="switch-bg"></span></label></div><label>直播间号或直播链接<input v-model.trim="config[p.id].room" :placeholder="p.placeholder" autocomplete="off"></label><label>Cookie（可选，需要时填写）<textarea v-model="config[p.id].cookie" :placeholder="cookieConfigured[p.id]?'已保存 Cookie；留空表示保持原值':'没有 Cookie 也可尝试连接'" rows="3"></textarea></label><p class="tip">{{p.id==='douyin'?'抖音直播页解析可能需要已登录 Cookie，接口规则变化可能导致接入失败。':'B站默认以匿名身份连接；需要时可设置登录 Cookie。'}}</p></article></div><article class="panel rules"><h2>弹幕处理</h2><label class="check"><input type="checkbox" v-model="config.auto_queue"> 开启自动排队</label><label>排队关键词<input v-model.trim="config.command" maxlength="16" placeholder="排队"></label><div class="switch-grid"><label class="check"><input type="checkbox" v-model="config.switches.paidui"> 总排队开关</label><label class="check"><input type="checkbox" v-model="config.switches.guanfu_paidui"> 官服排队</label><label class="check"><input type="checkbox" v-model="config.switches.bfu_paidui"> B服排队</label><label class="check"><input type="checkbox" v-model="config.switches.chaoji_paidui"> 超级排队</label><label class="check"><input type="checkbox" v-model="config.switches.mifu_paidui"> 米服排队</label><label class="check"><input type="checkbox" v-model="config.switches.quxiao_paidui"> 自助取消</label><label class="check"><input type="checkbox" v-model="config.switches.xiugai_paidui"> 自助修改</label></div><label>最大排队人数（0 为不限制）<input type="number" min="0" max="10000" v-model.number="config.max_queue"></label><label>管理员名单（每行一个）<textarea rows="3" v-model="adminsText" placeholder="输入管理员昵称"></textarea></label><label>黑名单（每行一个昵称或用户 ID）<textarea rows="3" v-model="blacklistText" placeholder="输入黑名单用户"></textarea></label><label>语言设置<input v-model="config.language" placeholder="中文"></label><p class="tip">当前存档槽位：{{config.archive_slot || 1}}。10 个独立存档槽位可在直播总览页切换；支持导入原版存档 ZIP 内的所有槽位。</p><p class="tip">发送关键词，或「关键词 + 空格 + 备注」入队。同平台同用户不能重复入队，手动移除后可重新排队。</p></article><button class="btn primary submit" :disabled="busy" @click="saveConfig">{{busy?'保存中…':'保存并重新连接'}}</button>
 <article class="panel rules"><h2>导入旧版 BiliPDJ 配置</h2><p class="tip">可直接选择旧版 config.yaml 或设置备份 ZIP（含 config.yaml、style.json、appearance.json、blacklist.csv 与队列 CSV）。预览不改变当前设置；导入会将原始文件与当前状态备份至 data/migration-backup。</p>
 <input type="file" accept=".zip,.yaml,.json,.csv" @change="selectLegacyFile" aria-label="旧版配置文件"><div class="manual"><button class="btn" :disabled="busy||!legacyFile" @click="legacyAction('preview')">预览兼容内容</button><button class="btn primary" :disabled="busy||!legacyFile" @click="legacyAction('import')">确认导入旧版配置</button></div>
 <div v-if="legacyPreview" class="legacy-report"><strong>识别文件：{{legacyPreview.files.join('、')}}</strong><p>映射字段：{{legacyPreview.mapped.join('、')}}</p><p>当前队列人数：{{legacyPreview.queue_count}}，黑名单：{{legacyPreview.blacklist_count}}</p><p v-if="legacyPreview.slot_counts">已识别槽位：{{JSON.stringify(legacyPreview.slot_counts)}}</p><p v-for="(warn,i) in legacyPreview.warnings" :key="i" class="tip">注意：{{warn}}</p></div>
 </article></template>
<template v-else><div class="page-title"><div><p class="eyebrow">RELEASE MANAGEMENT</p><h1>检查软件更新</h1><p class="muted">从 bilipdj-go GitHub Releases 获取新版本，只下载经过 SHA-256 校验的更新包。</p></div></div><article class="panel updates"><span class="meta">当前版本</span><h2>v{{status.version||'0.1.0'}}</h2><button class="btn primary" :disabled="busy" @click="checkUpdate">{{busy?'正在检查…':'检查更新'}}</button><div v-if="release" class="release"><b>最新版本：{{release.version}}</b><p>目标发行包：{{release.asset || '暂无当前平台构建'}}</p><p>{{release.update_available?'发现可用更新。':release.has_sha256?'当前版本或不支持自动判断新旧版本。':'尚无可验证的发行资源。'}}</p><button v-if="release.update_available" class="btn" @click="downloadUpdate" :disabled="busy">下载并校验更新包</button><p class="tip">更新包只会暂存到 data/updates。替换并重启需要手动操作；Docker 应拉取新镜像。</p></div></article></template>
</main><footer>BiliPDJ Go · 本地优先 · 仅供直播管理使用</footer></div></div>
<script src="/vue.global.js"></script><script src="/app.js"></script></body></html>
