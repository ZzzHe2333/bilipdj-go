<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiliPDJ · OBS</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:white;background:transparent}.board{margin:14px;background:rgba(10,19,35,.88);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:20px;min-width:300px}header{font-size:24px;font-weight:800;padding:0 0 15px;border-bottom:1px solid #475569}span{color:#67e8f9}ol{margin:0;padding:12px 0 0;list-style:none}li{display:flex;align-items:center;gap:14px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:20px}.rank{width:32px;color:#a5b4fc;font-weight:700}.badge{font-size:12px;color:#94a3b8;margin-left:auto}p{color:#94a3b8}</style></head><body><div id="app"><div class="board"><header>实时排队 <span>{{queue.length}}</span></header><ol><li v-for="(q,i) in queue.slice(0,15)" :key="q.key"><span class="rank" v-if="style.show_sequence">{{i+1}}.</span>{{q.username}}<small class="badge">{{q.platform==='bilibili'?'B站':q.platform==='douyin'?'抖音':'手动'}}</small></li></ol><p v-if="queue.length===0">暂无观众排队</p></div></div><script src="/vue.global.js"></script><script>const {createApp,ref,onMounted}=Vue;createApp({setup(){const queue=ref([]),style=ref({show_sequence:true});async function readStyle(){try{const s=await(await fetch('/api/style')).json();style.value=s;document.body.style.fontFamily=s.queue_font_family||'system-ui';document.body.style.color=s.text_color||'white';document.querySelector('.board').style.background=s.bg1||'#0e2036';document.querySelectorAll('.queue').forEach(e=>e.style.fontSize=(Number(s.queue_font_size)||30)+'px')}catch{}}onMounted(async()=>{await readStyle();try{queue.value=await(await fetch('/api/queue')).json()}catch{}const es=new EventSource('/api/events');es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='queue')queue.value=m.data}catch{}}});return {queue,style}}}).mount('#app')</script></body></html>
