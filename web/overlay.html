<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiliPDJ Go · OBS</title>
<style>
*{box-sizing:border-box}html,body{background:transparent!important;margin:0;color:white;font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}[v-cloak]{display:none}
#app{height:100vh;width:100%;padding:0;background:transparent}.board{max-height:100%;height:100%;overflow:hidden;border:0;box-shadow:none;backdrop-filter:none}
header{font-size:22px;font-weight:800;margin-bottom:12px}header small{font-size:.7em;opacity:.8}
ol{list-style:none;padding:0;margin:0;max-height:calc(100vh - 80px);overflow:auto;scrollbar-width:none}ol::-webkit-scrollbar{display:none}
.board.no-header ol{max-height:100vh}
li{display:flex;gap:12px;align-items:center;transition:transform .2s,opacity .2s;overflow-wrap:anywhere}
.rank{flex:0 0 2em;opacity:.7}.entry{min-width:0;flex:1;overflow-wrap:anywhere}.note{font-size:.62em;opacity:.75}
.badge{font-size:12px;opacity:.75;flex:none;display:inline-flex;justify-content:center;align-items:center;min-width:50px;text-align:center}
p{opacity:.6}
</style></head><body><div id="app" v-cloak>
<section class="board" :class="{'no-header':style.obs_show_header!==true}" :style="boardStyle">
<header v-if="style.obs_show_header===true">实时排队 <small>{{displayQueue.length}} 人 · 槽位 {{activeSlot}}</small></header>
<ol ref="scrollEl" :style="listStyle"><li v-for="(q,i) in displayQueue" :key="q.key" :style="itemStyle">
 <span class="rank" v-if="style.show_sequence">{{i+1}}.</span>
 <span class="entry" :style="entryAlignment"><span :style="entryTextStyle">{{q.username}}</span></span>
</li></ol></section></div>
<script src="/vue.global.js"></script><script>
const {createApp,ref,computed,onMounted,onUnmounted,nextTick,watch}=Vue;
createApp({setup(){
const queue=ref([]),activeSlot=ref(1),savedStyle=ref({}),previewStyle=ref(null),scrollEl=ref(null),demoMode=ref(false);
const demoEntries=[
 {key:'obs-demo-1',username:'预览用户 A',note:'这里显示排队内容',platform:'manual',source_platform:''},
 {key:'obs-demo-2',username:'预览用户 B',note:'可拖动字号滑块',platform:'bilibili'}
];
const displayQueue=computed(()=>demoMode.value&&queue.value.length===0?demoEntries:queue.value);
const style=computed(()=>previewStyle.value??savedStyle.value);
function numeric(key,fallback,min,max){const v=style.value[key];const n=Number(v);return v!==null&&v!==undefined&&v!==''&&Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback}
function safeColor(v,fallback){return typeof v==='string'&&(/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(v)||/^rgba?\([\d., %]+\)$/.test(v))?v:fallback}
function alphaColor(v,fallback,alpha){
 const c=safeColor(v,fallback);
 const m=/^#([0-9a-fA-F]{6})$/.exec(c);if(!m)return c;
 const hex=m[1];return 'rgba('+parseInt(hex.slice(0,2),16)+','+parseInt(hex.slice(2,4),16)+','+parseInt(hex.slice(4,6),16)+','+alpha+')';
}
const platformName=p=>({bilibili:'B站',douyin:'抖音',huya:'虎牙',kuaishou:'快手',douyu:'斗鱼',wechat_mp:'微信公众号'})[p]||p||'无来源';
const queueSourceLabel=q=>q.platform==='manual'?platformName(q.source_platform):platformName(q.platform);
const boardStyle=computed(()=>{
 const a=numeric('background_opacity',94,0,100)/100;
 // Legacy versions saved show_background=true. New transparent_background opts
 // out of any old panel fill unless the user explicitly turns it off in settings.
 const transparent=style.value.transparent_background!==false;
 const background=transparent||style.value.show_background===false?'transparent':
  'linear-gradient(145deg,'+alphaColor(style.value.bg1,'#0e2036',a)+','+alphaColor(style.value.bg2,'#060b14',a)+','+alphaColor(style.value.bg3,'#020409',a)+')';
 return {background, color:safeColor(style.value.text_color,'#eaf6ff'),
  borderRadius:transparent?'0px':numeric('board_radius',18,0,60)+'px',
  padding:transparent?'0px':'18px',boxShadow:'none'};
});
const itemStyle=computed(()=>({
 fontSize:numeric('queue_font_size',50,10,200)+'px',fontFamily:style.value.queue_font_family||'Microsoft YaHei, sans-serif',
 fontWeight:['400','500','600','700','800','900'].includes(String(style.value.queue_font_weight))?String(style.value.queue_font_weight):'700',
 fontStyle:style.value.queue_font_style==='italic'?'italic':'normal',
 letterSpacing:numeric('queue_letter_spacing',0,-10,30)+'px',
 wordSpacing:numeric('queue_word_spacing',0,-10,30)+'px',
 lineHeight:numeric('queue_line_height',1.2,.8,3),
 padding:numeric('queue_item_padding_y',8,0,100)+'px '+numeric('queue_item_padding_x',14,0,120)+'px',
 marginBottom:numeric('queue_item_gap',10,0,100)+'px',opacity:numeric('queue_text_opacity',100,0,100)/100,
 WebkitTextStroke:style.value.text_stroke_enabled?'1px '+safeColor(style.value.text_stroke_color,'#000000'):'none',
 textShadow:style.value.text_stroke_enabled?'0 1px 2px #0007':'none'
}));
const entryAlignment=computed(()=>({textAlign:['left','center','right'].includes(style.value.queue_text_align)?style.value.queue_text_align:'left'}));
const listStyle=computed(()=>{
 const font=numeric('queue_font_size',50,10,200);
 const line=numeric('queue_line_height',1.2,.8,3);
 const row=font*line+2*numeric('queue_item_padding_y',8,0,100)+numeric('queue_item_gap',10,0,100);
 const count=Math.round(numeric('queue_visible_count',5,1,100));
 return {maxHeight:'min(100%, '+Math.ceil(row*count)+'px)',overflowY:'auto'};
});
const entryTextStyle=computed(()=>style.value.queue_gradient_enabled?{
 background:'linear-gradient(90deg,'+safeColor(style.value.text_grad_start,'#ffffff')+','+safeColor(style.value.text_grad_end,'#aaccff')+')',
 WebkitBackgroundClip:'text',backgroundClip:'text',WebkitTextFillColor:'transparent'}:{});
async function refreshStyle(){try{const r=await fetch('/api/style',{cache:'no-store'});if(r.ok){const v=await r.json();if(JSON.stringify(v)!==JSON.stringify(savedStyle.value))savedStyle.value=v}}catch{}}
async function loadQueue(){try{const r=await fetch('/api/queue',{cache:'no-store'});if(r.ok){const v=await r.json();if(JSON.stringify(v)!==JSON.stringify(queue.value))queue.value=v;}const slots=await fetch('/api/queue/slots',{cache:'no-store'});if(slots.ok)activeSlot.value=(await slots.json()).active_slot||1}catch{}}
let scrollFrame=null,lastFrame=0,pauseUntil=0;
function stopScrolling(){if(scrollFrame!==null)cancelAnimationFrame(scrollFrame);scrollFrame=null;lastFrame=0;pauseUntil=0}
function scrollStep(ts){
 scrollFrame=null;
 if(!style.value.auto_scroll||!scrollEl.value||document.hidden)return;
 const el=scrollEl.value,max=Math.max(0,el.scrollHeight-el.clientHeight);
 if(max<=1){lastFrame=0;return}
 if(pauseUntil>0&&ts>=pauseUntil){
  el.scrollTop=0;pauseUntil=0;lastFrame=ts;
 }else if(pauseUntil===0){
  const delta=lastFrame===0?0:Math.min(0.1,(ts-lastFrame)/1000);
  el.scrollTop=Math.min(max,el.scrollTop+numeric('queue_scroll_speed',30,1,300)*delta);
  if(el.scrollTop>=max-1)pauseUntil=ts+1400;
 }
 lastFrame=ts;
 scrollFrame=requestAnimationFrame(scrollStep);
}
async function restartScrolling(){
 stopScrolling();await nextTick();
 if(style.value.auto_scroll&&!document.hidden&&scrollEl.value){scrollEl.value.scrollTop=0;scrollFrame=requestAnimationFrame(scrollStep)}
}

function applyPreviewMessage(event){
 if(window.parent===window||event.source!==window.parent||event.origin!==window.location.origin)return;
 if(event.data?.type!=='bilipdj:obs-preview-style')return;
 const v=event.data.style;
 if(v===null){previewStyle.value=null;demoMode.value=false;return;}
 if(v&&typeof v==='object'&&!Array.isArray(v)){previewStyle.value={...v};demoMode.value=true;}
}
let events,stylePoll,queuePoll;
onMounted(()=>{
 window.addEventListener('message',applyPreviewMessage);
 refreshStyle();loadQueue();
 events=new EventSource('/api/events');
 events.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='queue'){if(JSON.stringify(x.data)!==JSON.stringify(queue.value))queue.value=x.data;}else if(x.type==='style'){if(JSON.stringify(x.data)!==JSON.stringify(savedStyle.value))savedStyle.value=x.data;}}catch{}};
 stylePoll=setInterval(refreshStyle,8000);queuePoll=setInterval(loadQueue,25000);void restartScrolling();document.addEventListener('visibilitychange',restartScrolling);window.addEventListener('resize',restartScrolling);
});
watch([style,displayQueue],()=>{void restartScrolling()},{deep:true});
onUnmounted(()=>{window.removeEventListener('message',applyPreviewMessage);document.removeEventListener('visibilitychange',restartScrolling);window.removeEventListener('resize',restartScrolling);events?.close();clearInterval(stylePoll);clearInterval(queuePoll);stopScrolling()});
return {queue,displayQueue,activeSlot,style,itemStyle,boardStyle,entryAlignment,entryTextStyle,platformName,queueSourceLabel,listStyle,scrollEl};
}}).mount('#app');
</script></body></html>
