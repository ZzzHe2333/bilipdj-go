<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiliPDJ Go · OBS</title>
<style>
*{box-sizing:border-box}body{background:transparent;margin:0;color:white;font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}[v-cloak]{display:none}
#app{height:100vh;padding:14px}.board{max-height:100%;overflow:hidden;border-radius:18px;padding:18px;background:rgba(14,32,54,.94)}
header{font-size:22px;font-weight:800;margin-bottom:12px}header small{font-size:.7em;opacity:.8}
ol{list-style:none;padding:0;margin:0;max-height:calc(100vh - 104px);overflow:auto;scrollbar-width:none}ol::-webkit-scrollbar{display:none}
li{display:flex;gap:12px;align-items:center;transition:transform .2s,opacity .2s;overflow-wrap:anywhere}
.rank{flex:0 0 2em;opacity:.7}.entry{min-width:0;flex:1}.note{font-size:.62em;opacity:.75}.badge{font-size:12px;opacity:.65;margin-left:auto}p{opacity:.6}
</style></head><body><div id="app" v-cloak><section class="board" :style="boardStyle"><header>实时排队 <small>{{queue.length}} 人 · 槽位 {{activeSlot}}</small></header><ol ref="scrollEl"><li v-for="(q,i) in queue" :key="q.key" :style="itemStyle"><span class="rank" v-if="style.show_sequence">{{i+1}}.</span><span class="entry"><span v-if="q.mode">[{{q.mode}}] </span>{{q.username}}<span v-if="q.note" class="note"> · {{q.note}}</span></span><small class="badge">{{q.platform==='bilibili'?'B站':q.platform==='douyin'?'抖音':'手动'}}</small></li></ol><p v-if="queue.length===0">暂无观众排队</p></section></div>
<script src="/vue.global.js"></script><script>
const {createApp,ref,computed,onMounted,onUnmounted,nextTick}=Vue;
createApp({setup(){
const queue=ref([]),activeSlot=ref(1),style=ref({}),scrollEl=ref(null);
const numeric=(key,fallback,min,max)=>{const n=Number(style.value[key]);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback};
const boardStyle=computed(()=>({background:`linear-gradient(145deg, ${safeColor(style.value.bg1,'#0e2036')}, ${safeColor(style.value.bg2,'#060b14')})`,color:safeColor(style.value.text_color,'#eaf6ff')}));
function safeColor(v, fallback){return typeof v==='string'&& (/^#[0-9a-fA-F]{3,8}$/.test(v)||/^rgba?\([\d., %]+\)$/.test(v))?v:fallback}
const itemStyle=computed(()=>({fontSize:numeric('queue_font_size',50,12,120)+'px',fontFamily:style.value.queue_font_family||'Microsoft YaHei, sans-serif',fontWeight:style.value.queue_font_weight||'700',fontStyle:style.value.queue_font_style==='italic'?'italic':'normal',letterSpacing:numeric('queue_letter_spacing',0,-10,30)+'px',wordSpacing:numeric('queue_word_spacing',0,-10,30)+'px',lineHeight:style.value.queue_line_height||'1.20',padding:numeric('queue_item_padding_y',8,0,100)+'px '+numeric('queue_item_padding_x',14,0,120)+'px',marginBottom:numeric('queue_item_gap',10,0,100)+'px',textAlign:['left','right','center'].includes(style.value.queue_text_align)?style.value.queue_text_align:'left',opacity:numeric('queue_text_opacity',100,0,100)/100,WebkitTextStroke:style.value.text_stroke_enabled?'1px '+safeColor(style.value.text_stroke_color,'#000000'):'none',textShadow:style.value.text_stroke_enabled?'0 1px 2px #0007':'none'}));
async function refreshStyle(){try{const r=await fetch('/api/style',{cache:'no-store'});if(r.ok)style.value=await r.json()}catch{}}
async function loadQueue(){try{const r=await fetch('/api/queue',{cache:'no-store'});if(r.ok)queue.value=await r.json();const slots=await fetch('/api/queue/slots',{cache:'no-store'});if(slots.ok)activeSlot.value=(await slots.json()).active_slot||1}catch{}}
async function scrollQueue(){if(!style.value.auto_scroll||!scrollEl.value)return;await nextTick();const el=scrollEl.value;el.scrollTop=el.scrollTop>=el.scrollHeight-el.clientHeight-2?0:Math.min(el.scrollHeight-el.clientHeight,el.scrollTop+1)}
let events,stylePoll,queuePoll,scrollTimer;
onMounted(()=>{refreshStyle();loadQueue();events=new EventSource('/api/events');events.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='queue')queue.value=x.data}catch{}};stylePoll=setInterval(refreshStyle,12000);queuePoll=setInterval(loadQueue,25000);scrollTimer=setInterval(scrollQueue,80)});
onUnmounted(()=>{events?.close();clearInterval(stylePoll);clearInterval(queuePoll);clearInterval(scrollTimer)});
return {queue,activeSlot,style,itemStyle,boardStyle,scrollEl};}}).mount('#app');
</script></body></html>
