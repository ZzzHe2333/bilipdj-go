name: Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - id: version
        shell: bash
        run: |
          V=$(tr -d '\r\n' < VERSION)
          test "$(sed -n 's/^var version = \"\([^\"]*\)\"/\1/p' main.go)" = "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Reject publishing an existing version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "Version tag already exists; increment VERSION instead of overwriting an existing Release"
            exit 1
          fi
      - run: go test ./... && go vet ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Package native executable and checksum
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          RELEASE_TAG: v${{ needs.test.outputs.version }}
        run: |
          mkdir -p dist/package
          EXT=""; [[ "$GOOS" == windows ]] && EXT=.exe
          LDFLAGS="-s -w -X main.version=${RELEASE_TAG#v}"
          [[ "$GOOS" == windows ]] && LDFLAGS="$LDFLAGS -H=windowsgui"
          CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "dist/package/bilipdj-go${EXT}" .
          cp README.md LICENSE NOTICE.md dist/package/
          cp -r third_party dist/package/
          (cd dist/package && zip -q -r "../bilipdj-go-${GOOS}-${GOARCH}.zip" .)
          (cd dist && sha256sum "bilipdj-go-${GOOS}-${GOARCH}.zip" > "bilipdj-go-${GOOS}-${GOARCH}.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: bilipdj-go-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: Generate updater manifest for proxy-only networks
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: |
          python3 - <<'PYMANIFEST'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          packages = {}
          for pkg in sorted(root.glob('bilipdj-go-*.zip')):
              digest = hashlib.sha256(pkg.read_bytes()).hexdigest()
              checksum_file = root / (pkg.name + '.sha256')
              assert checksum_file.is_file(), pkg.name
              assert checksum_file.read_text().split()[0].lower() == digest, pkg.name
              packages[pkg.name] = {'name': pkg.name, 'size': pkg.stat().st_size, 'sha256': digest}
          assert len(packages) == 6, 'Expected all six architectures'
          version = os.environ['RELEASE_VERSION']
          manifest = {'version': version, 'tag_name': 'v'+version, 'packages': packages}
          (root / 'update-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PYMANIFEST
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: BiliPDJ Go v${{ needs.test.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
            dist/update-manifest.json
