name: Build and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./... && go vet ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Package native executable and checksum
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          RELEASE_TAG: v0.2.2
        run: |
          mkdir -p dist/package
          EXT=""; [[ "$GOOS" == windows ]] && EXT=.exe
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_TAG#v}" -o "dist/package/bilipdj-go${EXT}" .
          cp README.md LICENSE NOTICE.md dist/package/
          (cd dist/package && zip -q -r "../bilipdj-go-${GOOS}-${GOARCH}.zip" .)
          (cd dist && sha256sum "bilipdj-go-${GOOS}-${GOARCH}.zip" > "bilipdj-go-${GOOS}-${GOARCH}.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: bilipdj-go-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          name: BiliPDJ Go v0.2.2
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
