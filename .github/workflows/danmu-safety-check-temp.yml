name: Verify Live Queue Safety (Temporary)
on:
  push:
    branches: [fix/danmu-import-cookie-queue-safety]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Frontend syntax
        run: node --check web/app.js && node --check web/queue-standalone.js
      - name: Unit tests and vet
        run: go test ./... && go vet ./...
      - name: Race tests
        run: go test -race ./...
  cross:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compile only
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/bilipdj-go-test .
