name: Verify Windows Tray Exit (Temporary)
on:
  push:
    branches: [fix/windows-tray-instant-exit]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - run: node --check web/app.js && node --check web/queue-standalone.js
      - run: go test ./... && go vet ./...
      - run: go test -race ./...
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - name: Exercise actual Windows-built tray tests
        run: go test -v -run 'TestTray|TestNoTray' .
      # The pre-existing full Windows suite has unrelated failures around
      # POSIX file modes and Windows state-file reload; run the focused
      # Windows tray tests here and the complete Linux tests in the go job.
      - name: Windows production-style build
        run: go build -trimpath -ldflags "-H windowsgui" -o bilipdj-go.exe .
  cross:
    needs: go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23'}
      - name: Compile without releasing
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/bilipdj-go-check .
