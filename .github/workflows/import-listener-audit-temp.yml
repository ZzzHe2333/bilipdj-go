name: Verify Import and Listener Safety (Temporary)
on:
  push:
    branches: [fix/python-csv-local-rollback-and-stale-room-callback]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Frontend syntax
        run: node --check web/app.js && node --check web/queue-standalone.js
      - name: Test and static analysis
        run: go test ./... && go vet ./...
      - name: Race regression
        run: go test -race ./...
  cross:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compile without packaging
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/bilipdj-go-check .
